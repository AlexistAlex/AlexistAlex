<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9a3c" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#b30000" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#b30000"/>
      <stop offset="45%" stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#ffe9a8"/>
    </linearGradient>
    <linearGradient id="wax" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="50%" stop-color="#4a4a4a"/>
      <stop offset="100%" stop-color="#1c1c1c"/>
    </linearGradient>
    <filter id="textGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="1.2"/></filter>
    <style>
      .flame { transform-origin: 110px 128px; animation: flick 0.18s infinite alternate ease-in-out; }
      .halo  { transform-origin: 110px 115px; animation: halo 2.4s infinite ease-in-out; }
      .name  { animation: pulse 3s infinite ease-in-out; }
      .sub   { animation: fade 6s infinite ease-in-out; }
      @keyframes flick { 0% { transform: scale(1,1) skewX(0deg); } 50% { transform: scale(0.92,1.06) skewX(3deg); } 100% { transform: scale(1.04,0.95) skewX(-3deg); } }
      @keyframes halo  { 0%,100% { opacity: 0.85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
      @keyframes pulse { 0%,100% { fill: #8b0000; } 50% { fill: #e01010; } }
      @keyframes fade  { 0%,15% { opacity: 0; } 30%,85% { opacity: 1; } 100% { opacity: 0; } }
    </style>
  </defs>

  <rect width="800" height="220" rx="14" fill="#050505"/>
  <rect x="1" y="1" width="798" height="218" rx="14" fill="none" stroke="#3b0000" stroke-width="2"/>

  <!-- candle glow -->
  <circle class="halo" cx="110" cy="115" r="95" fill="url(#glow)"/>

  <!-- candle -->
  <rect x="96" y="132" width="28" height="70" rx="3" fill="url(#wax)"/>
  <path d="M96 136 q6 8 0 18" stroke="#5a5a5a" stroke-width="3" fill="none"/>
  <line x1="110" y1="132" x2="110" y2="124" stroke="#111" stroke-width="2"/>
  <ellipse cx="110" cy="203" rx="38" ry="5" fill="#140000"/>
  <path class="flame" d="M110 82 C 122 102, 122 120, 110 128 C 98 120, 98 102, 110 82 Z" fill="url(#flame)" filter="url(#blur)"/>

  <!-- rising embers -->
  <g fill="#ff3b1a">
    <circle cx="140" cy="230" r="2"><animate attributeName="cy" values="210;-10" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="230" r="1.5"><animate attributeName="cy" values="215;-10" dur="7s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="7s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="230" r="2.2"><animate attributeName="cy" values="220;-10" dur="6s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" begin="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="230" r="1.3"><animate attributeName="cy" values="215;-10" dur="8s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="8s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="230" r="1.8"><animate attributeName="cy" values="220;-10" dur="5.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="5.5s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="230" r="2"><animate attributeName="cy" values="215;-10" dur="6.5s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="6.5s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="230" r="1.4"><animate attributeName="cy" values="220;-10" dur="7.5s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7.5s" begin="4s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="230" r="1.2"><animate attributeName="cy" values="220;-10" dur="9s" begin="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="9s" begin="5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- name -->
  <text class="name" x="470" y="112" text-anchor="middle" font-family="'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="54" font-style="italic" letter-spacing="3" fill="#8b0000" filter="url(#textGlow)">AlexistAlex</text>
  <line x1="300" y1="130" x2="640" y2="130" stroke="#3b0000" stroke-width="1"/>
  <text class="sub" x="470" y="160" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" letter-spacing="2" fill="#9a9a9a">// coding in the dark</text>
</svg>
